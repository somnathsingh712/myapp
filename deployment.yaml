apiVersion: apps/v1
kind: Deployment
metadata:
  name: myapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
  template:
    metadata:
      labels:
        app: myapp
    spec:
      containers:
      - name: myapp
        image: somnaths712/myapp:latest   # base image (Jenkins will override)
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http